# Installable ComeHere layer. In a Web profile all three rows activate; in a
# headless profile the client row remains pending while the model tool works.
- insert:
    - id: come-here
      name: '@deepseek-ai/dsh-host-come-here'

    - id: tool-come-here
      name: '@deepseek-ai/dsh-tool-come-here'

    - id: ui-settings-come-here
      name: '@deepseek-ai/dsh-client-ui-settings-come-here'
